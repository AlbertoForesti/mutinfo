# Training configuration for Make swiss_roll dataset

defaults:
  - /model: flow_mlp_simple
  - /datamodule: swiss_roll
  - /optimizer: adam
  - _self_

prior_dim: 3

image_shape: null

log_samples: true
log_every_n_epochs: 5
n_samples_to_log: 512   


model:
  dim: 3
  h: 64


optimizer:
  lr: 1.0e-2

lightning_module:
  _target_: mutinfo.distributions.generative.lightning_flow.FlowLightningModule
  model_config: ${model}
  optimizer_config: ${optimizer}
  scheduler_config: null
  prior_dim: ${prior_dim}
  use_ema: ${use_ema}
  ema_decay: ${ema_decay}
  log_samples: ${log_samples}
  log_every_n_epochs: ${log_every_n_epochs}
  n_samples_to_log: ${n_samples_to_log}
  image_shape: ${image_shape}

# Enable EMA for better quality
use_ema: true
ema_decay: 0.999

# Override trainer configuration for 3D datasets
trainer_full:
  _target_: pytorch_lightning.Trainer
  max_epochs: 200
  accelerator: auto
  devices: 1
  precision: 32
  gradient_clip_val: 1.0
  log_every_n_steps: 50
  check_val_every_n_epoch: 1
  callbacks:
    - _target_: pytorch_lightning.callbacks.ModelCheckpoint
      monitor: val_loss
      mode: min
      save_top_k: 3
      save_last: true
      filename: 'flow-swiss_roll-{epoch:02d}-{val_loss:.4f}'
      dirpath: checkpoints_swiss_roll
      verbose: true
    - _target_: pytorch_lightning.callbacks.EarlyStopping
      monitor: val_loss
      mode: min
      patience: 10
      verbose: true
    - _target_: pytorch_lightning.callbacks.LearningRateMonitor
      logging_interval: step
  logger:
    _target_: pytorch_lightning.loggers.WandbLogger
    project: tmlr
    name: flow_swiss_roll
    save_dir: logs
    log_model: false
